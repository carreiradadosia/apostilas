models:
  - name: stg_pedidos
    columns:
      - name: pedido_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pago', 'cancelado', 'pendente', 'desconhecido']
  - name: vendas_por_dia
    columns:
      - name: dia
        data_tests: [unique, not_null]
