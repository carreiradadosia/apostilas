models:
  - name: stg_lojas
    description: One row per store.
    columns:
      - name: loja_id
        data_tests: [unique, not_null]
  - name: stg_produtos
    description: One row per product, current attributes from the latest photo.
    columns:
      - name: produto_id
        data_tests: [unique, not_null]
      - name: custo
        description: Null means unknown. Warns instead of becoming zero.
        data_tests:
          - not_null:
              config:
                severity: warn
  - name: stg_pedidos
    description: One row per order, latest load wins.
    columns:
      - name: pedido_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pago', 'cancelado', 'pendente', 'desconhecido']
  - name: stg_itens
    description: One row per order item.
    data_tests:
      - unique:
          arguments:
            column_name: "(pedido_id || '-' || item_seq)"
    columns:
      - name: pedido_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pedidos')
                field: pedido_id
  - name: stg_atendimentos
    description: One row per service record, in local time.
    columns:
      - name: atendimento_id
        data_tests: [unique, not_null]
