name: orquestracao-lab

x-airflow-common:
  &airflow-common
  image: apache/airflow:3.3.2-python3.13
  profiles: ["airflow"]
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?run ./preparar.sh first}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET:?run ./preparar.sh first}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '30'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONN_LOJA_DB: postgresql://loja:${LOJA_DB_PASSWORD:?run ./preparar.sh first}@postgres:5432/loja
    AIRFLOW_CONN_DW_DB: postgresql://dw:${DW_DB_PASSWORD:?run ./preparar.sh first}@postgres:5432/dw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run ./preparar.sh first}
      POSTGRES_DB: airflow
      LOJA_DB_PASSWORD: ${LOJA_DB_PASSWORD:?run ./preparar.sh first}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?run ./preparar.sh first}
      REPLICA_DB_PASSWORD: ${REPLICA_DB_PASSWORD:?run ./preparar.sh first}
      DW_DB_PASSWORD: ${DW_DB_PASSWORD:?run ./preparar.sh first}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  runner:
    build: ./runner
    image: orquestracao-lab-runner:local
    profiles: ["manual"]
    command: ["python", "scripts/pipeline.py"]
    environment:
      DW_URL: postgresql://dw:${DW_DB_PASSWORD:?run ./preparar.sh first}@postgres:5432/dw
    volumes:
      - ./scripts:/lab/scripts:ro
      - ./dags/sql:/lab/dags/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags}
        /entrypoint airflow version
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    user: "0:0"

volumes:
  postgres-db-volume:
